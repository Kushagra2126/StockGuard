name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Stage 1 - CI: lint and test on every push and pull request
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Stage 2 - Build the Docker image and prove it starts
  build:
    name: Docker build and smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t stockguard .

      - name: Smoke test /health
        run: |
          docker run -d --name stockguard -p 3000:3000 stockguard
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then
              echo
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs stockguard
          exit 1

  # Stage 3 - CD: release to Render (main branch pushes only)
  deploy:
    name: Deploy to Render
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy for this exact commit
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}&ref=${{ github.sha }}"

  # Stage 4 - Verify the live site is running this commit (optional:
  # skipped automatically if the LIVE_APP_URL secret is not set)
  verify:
    name: Verify live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the live /health to report the new commit
        env:
          LIVE_APP_URL: ${{ secrets.LIVE_APP_URL }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$LIVE_APP_URL" ]; then
            echo "LIVE_APP_URL secret not set - skipping verification"
            exit 0
          fi
          SHORT=${SHA:0:7}
          for i in $(seq 1 40); do
            BODY=$(curl -fsS "$LIVE_APP_URL/health" || true)
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q "\"commit\":\"$SHORT\""; then
              echo "Live site is running commit $SHORT"
              exit 0
            fi
            sleep 15
          done
          echo "Live site did not report commit $SHORT in time"
          exit 1
